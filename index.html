<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="magic-video" src="hey-does-george-spahn-still-own-this-ranch.mp4" preload="auto" autoplay loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
        <a-video src="#magic-video" position="0 0 0" width="1" height="1.778" rotation="0 0 0"></a-video>
      </a-entity>
      
    </a-scene>

    <script>
      const target = document.querySelector('#target-entity');
      const vid = document.querySelector('#magic-video');

      target.addEventListener("targetFound", event => {
        console.log("Target found! Playing video.");
        vid.play();
      });

      target.addEventListener("targetLost", event => {
        console.log("Target lost. Pausing video.");
        vid.pause();
      });
    </script>
  </body>
</html>
